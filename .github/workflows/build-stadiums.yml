name: build-stadiums

# Preseason stadium reference rebuild (PLAN Phase 5): ERA5 climatology +
# CFBD/ESPN venues + nflverse ids + Wikidata + OSM Overpass orientation +
# EPQS/Open-Meteo elevation -> data/stadiums.csv + data/climatology.csv.
# Manual dispatch only; the result is opened as a PR (never committed to main)
# so the diff, coverage report and needs_review rows get eyeballed first.
#
# Secrets: CFBD_API_KEY (optional; ESPN fallback without it), TELEGRAM_BOT_TOKEN,
# TELEGRAM_CHAT_ID (failure ping). GITHUB_TOKEN needs contents+pull-requests write.

on:
  workflow_dispatch:
    inputs:
      all_rows:
        description: "Rebuild every row (FCS etc.), not just NFL + FBS + nflverse venues"
        type: boolean
        default: false
      refresh_climatology:
        description: "Re-fetch ERA5 climatology even for cached stadiums"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: football-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install httpx pandas numpy timezonefinder shapely rapidfuzz pytest

      - name: Cache remote payloads
        uses: actions/cache@v4
        with:
          path: .cache/stadium_build
          key: stadium-build-${{ github.run_id }}
          restore-keys: stadium-build-

      # ERA5 first so build_stadiums can fill blank avg_wind_*/avg_temp_f from data/climatology.csv.
      - name: Climatology (Open-Meteo ERA5 archive)
        run: |
          python -m pipeline.stadiums.climatology --cache-dir .cache/stadium_build \
            ${{ inputs.all_rows && '--all' || '' }} ${{ inputs.refresh_climatology && '--refresh' || '' }}

      - name: Build stadiums.csv
        run: |
          python -m pipeline.stadiums.build_stadiums --cache-dir .cache/stadium_build \
            --report .cache/stadium_build/report.json ${{ inputs.all_rows && '--all' || '' }}

      - name: Loader tests against the new csv
        run: python -m pytest tests/test_stadium_loader.py tests/test_build_stadiums.py tests/test_climatology.py -q

      - name: Coverage summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open(".cache/stadium_build/report.json"))
          print("## Stadium build report\n")
          print(f"- in scope: {r['in_scope']} / {r['total']} rows")
          print(f"- OSM orientation share: {r['osm_orientation_share']:.1%} (target >= 95%)")
          print(f"- orientation_src: `{r['orientation_src']}`")
          print(f"- latlon_src: `{r['latlon_src']}`  elev_src: `{r['elev_src']}`")
          print(f"- wikidata matched: {r['wikidata_matched']}  espn matched: {r['espn_matched']}")
          print(f"- unmapped teams: {r['unmapped_teams'] or 'none'}")
          print(f"- unmapped nflverse venues: {r['unmapped_nflverse'] or 'none'}")
          print("- needs_review:")
          for line in r["needs_review"] or ["none"]:
              print(f"  - {line}")
          PY

      - name: Open PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            data/stadiums.csv
            data/climatology.csv
          branch: chore/build-stadiums
          delete-branch: true
          commit-message: "data: rebuild stadiums.csv + climatology.csv (build-stadiums)"
          title: "data: preseason stadium rebuild"
          body: |
            Automated `build-stadiums` run (${{ github.run_id }}).

            Review `needs_review` rows and the coverage numbers in the job summary before merging;
            corrections go in `data/stadiums_overrides.csv`, which always wins on the next build.
          labels: data

      - name: Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="build-stadiums failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true

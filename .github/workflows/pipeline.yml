name: pipeline

# Phase 3: schedule -> stadiums -> weather -> impact v1 -> odds (httpx books in the
# light job, BetOnline in the Playwright job) -> board JSON + D1 SQL + legacy files.
#
#   * State (openers / history / wx_history / archive_last / wx_last / alerts /
#     scrape_baseline / telegram_state / cf_heartbeat / closings / status) round-trips
#     through R2 board/: fetched BEFORE the build (a missing object is a fresh
#     start; ANY other wrangler error fails the job so a transient outage can
#     never clobber openers or alert markers), pushed back AFTER.
#   * R2 put order: raw/ captures, snapshots/, board payloads, state files, and
#     board/meta.json LAST as the commit marker (a mid-loop failure leaves the old
#     meta over old-or-new data, never new meta over mixed vintages).
#   * D1 (football-odds) gets data/d1_inserts.sql (change-only) via
#     `wrangler d1 execute --file`, gated by hashFiles so an empty run is a no-op.
#   * Self-check re-fetches board/meta.json and asserts run_id + a 50 % content
#     floor against the previous meta (bypassed by the `force` input).
#   * Nothing is committed back to git (Phase 4): the legacy nfl_weather.csv /
#     cfb_weather.xlsx are written to data/ and uploaded to R2 legacy/ in the put
#     loop; data/state/ rides R2 board/.
#
# Primary scheduler: Cloudflare Worker crons (site/worker/wrangler.toml) dispatch
# this workflow; the schedule below is the off-the-minute UTC backstop.
# Adapted from golf_scraping/.github/workflows/board.yml (R2 loops, d1 execute,
# Telegram failure step) + betonline.yml (Playwright job); the golf commit loop
# is intentionally NOT ported (no generated data in git).
#
# Requires GitHub secrets: CFBD_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID,
# CLOUDFLARE_API_TOKEN (Workers Scripts:Edit, R2:Edit, D1:Edit), CF_ACCOUNT_ID.
# Optional: PROPHETX_*; BOOK_BETONLINE_ENABLED=0 (repo variable) skips Playwright;
#   BOOK_PROPHETX_ENABLED=0 (repo variable) skips ProphetX (sandbox-only creds).

on:
  # UTC backstop ~= old 05:15 / 10:00 / 16:20 ET cadence, off-the-minute (GitHub
  # drops on-the-hour schedules).
  schedule:
    - cron: '17 9,14,20 * * *'
    # In-season cadence (ARCH §9.1, mirrored in site/worker/SETUP.md §7). UTC, EDT-based,
    # GitHub DOW 0=Sun. Every schedule run is sport=all scope=full; pipeline.gate_check
    # trims off-season / no-game windows so idle fires cost ~1 minute.
    - cron: '17 14,20 * * 2,3'     # Tue/Wed 10:17, 16:17 ET (openers)
    - cron: '17 12-23/2 * * 4,5'   # Thu/Fri every 2h 08:17-19:17 ET
    - cron: '17 10-23 * * 6'       # Sat hourly 06:17-19:17 ET (CFB)
    - cron: '17 10-21 * * 0'       # Sun hourly 06:17-17:17 ET (NFL)
    - cron: '47 16,19,23 * * 0'    # Sun pre-kickoff 12:47/15:47/19:47 ET
    - cron: '17 22,23 * * 1,4'     # Mon/Thu night 18:17, 19:17 ET
  workflow_dispatch:
    inputs:
      sport:
        description: 'Sport to build'
        type: choice
        required: false
        default: all
        options:
          - all
          - nfl
          - cfb
      scope:
        description: 'Build scope: weather (no odds), light (httpx books), full (light + BetOnline via Playwright)'
        type: choice
        required: false
        default: full
        options:
          - weather
          - light
          - full
      force:
        description: 'Bypass the kickoff-horizon gate and the publish content floor'
        type: boolean
        required: false
        default: false

# Serialize writers so two ticks can never race on the R2 put loop.
# Queue rather than cancel so an in-flight build completes instead of leaving
# a partial publish.
concurrency:
  group: football-refresh
  cancel-in-progress: false

env:
  SPORT: ${{ inputs.sport || 'all' }}
  SCOPE: ${{ inputs.scope || 'full' }}
  FORCE: ${{ inputs.force == true && '1' || '' }}
  # Per-book kill switches (repo variables; default on). Disabled books are skipped
  # entirely: no scrape, no "0 lines" degradation, excluded from the volume check.
  BOOK_BETONLINE_ENABLED: ${{ vars.BOOK_BETONLINE_ENABLED || '1' }}
  BOOK_PINNACLE_ENABLED: ${{ vars.BOOK_PINNACLE_ENABLED || '1' }}
  BOOK_BETCRIS_ENABLED: ${{ vars.BOOK_BETCRIS_ENABLED || '1' }}
  BOOK_FANDUEL_ENABLED: ${{ vars.BOOK_FANDUEL_ENABLED || '1' }}
  BOOK_KALSHI_ENABLED: ${{ vars.BOOK_KALSHI_ENABLED || '1' }}
  BOOK_NOVIG_ENABLED: ${{ vars.BOOK_NOVIG_ENABLED || '1' }}
  BOOK_PROPHETX_ENABLED: ${{ vars.BOOK_PROPHETX_ENABLED || '1' }}
  # Model driving edges/alerts (ARCH §7.5). Stays v1 until the calibrate promotion rule is met;
  # pipeline/model/config.py falls back to v1 on any unknown value.
  ALERT_MODEL: ${{ vars.ALERT_MODEL || 'v1' }}
  # Telegram is an action channel. These repo variables can relax/tighten the
  # defaults without a code deploy.
  TELEGRAM_MIN_TIER: ${{ vars.TELEGRAM_MIN_TIER || 'mid' }}
  TELEGRAM_MIN_EDGE_PTS: ${{ vars.TELEGRAM_MIN_EDGE_PTS || '1.0' }}
  TELEGRAM_MAX_PER_RUN: ${{ vars.TELEGRAM_MAX_PER_RUN || '4' }}
  TELEGRAM_INCLUDE_OPENERS: ${{ vars.TELEGRAM_INCLUDE_OPENERS || '0' }}
  R2_BUCKET: football-board
  D1_DATABASE: football-odds
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
  # State files that round-trip through R2 board/ (ARCH §5).
  STATE_FILES: openers history wx_history archive_last wx_last alerts scrape_baseline telegram_state cf_heartbeat closings status

jobs:
  gate:
    # Cheap httpx-only check BEFORE installing the full stack: skip when no
    # kickoff is within the horizon (off-season). Fail-open to scrape.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.gate.outputs.run }}
      need_playwright: ${{ steps.gate.outputs.need_playwright }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install gate deps
        run: pip install httpx
      - name: Kickoff-horizon gate
        id: gate
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          PIPELINE_FORCE: ${{ inputs.force == true && '1' || '' }}
        run: |
          python -m pipeline.gate_check --sport "$SPORT" > gate.txt 2> gate.err || true
          cat gate.err || true
          cat gate.txt
          RUN="$(grep '^run=' gate.txt | tail -n1 | cut -d= -f2 || true)"
          case "$RUN" in
            skip) ;;
            *) RUN=scrape ;;   # fail-open: error/blank/unexpected -> scrape
          esac
          echo "Gate decision: $RUN"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          # Chromium only when the scope asks for the Playwright books and the
          # book is enabled; the light job never installs Playwright.
          NEED=false
          if [ "$RUN" = "scrape" ] && [ "$SCOPE" = "full" ] && [ "$BOOK_BETONLINE_ENABLED" != "0" ]; then
            NEED=true
          fi
          echo "need_playwright=$NEED"
          echo "need_playwright=$NEED" >> "$GITHUB_OUTPUT"

  light:
    needs: gate
    if: needs.gate.outputs.run == 'scrape'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps (no Playwright / Streamlit in the light job)
        run: |
          python -m pip install --upgrade pip
          grep -viE '^(playwright|playwright-stealth|streamlit|streamlit-plotly-events|plotly|fsspec|pytz)\b' requirements.txt > requirements-light.txt
          pip install -r requirements-light.txt
      - name: Run id
        run: echo "RUN_ID=$(date -u +%Y%m%dT%H%M%SZ)-gh${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
      - name: Fetch board state from R2
        # NoSuchKey (first run / new file) -> empty default. ANY other failure
        # (auth, 5xx, network) -> exit 1: running on blank state would re-record
        # openers and re-send every alert. This step must always fail the job.
        run: |
          mkdir -p data/state
          for f in $STATE_FILES meta; do
            DEST="data/state/$f.json"
            [ "$f" = "meta" ] && DEST="data/state/prev_meta.json"
            if OUT="$(npx --yes wrangler@4 r2 object get "$R2_BUCKET/board/$f.json" --file="$DEST" --remote 2>&1)"; then
              echo "$f.json fetched"
            elif echo "$OUT" | grep -qiE 'NoSuchKey|does not exist|not found|404'; then
              echo "::notice::$f.json absent (first run) - state starts empty"
              rm -f "$DEST"
            else
              echo "$OUT"
              echo "::error::R2 state fetch failed for $f.json (not NoSuchKey) - refusing to run on blank state"
              exit 1
            fi
          done
      - name: Build board
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROPHETX_API_KEY: ${{ secrets.PROPHETX_API_KEY }}
          PROPHETX_ACCESS_KEY: ${{ secrets.PROPHETX_ACCESS_KEY }}
          PROPHETX_SECRET_KEY: ${{ secrets.PROPHETX_SECRET_KEY }}
        run: |
          # 'full' runs the httpx books here; BetOnline is added by the playwright job.
          LIGHT_SCOPE="$SCOPE"
          [ "$LIGHT_SCOPE" = "full" ] && LIGHT_SCOPE=light
          python -m pipeline.build --sport "$SPORT" --scope "$LIGHT_SCOPE" --print --run-id "$RUN_ID" ${FORCE:+--force}
      - name: Push to R2
        # Order: raw/ captures, snapshots/, legacy/, board payloads, state files, then
        # meta.json LAST as the commit marker. Each put retries 3x and still fails
        # the job loudly (no silent partial publish).
        run: |
          put() {  # put <r2 key> <local file>
            for i in 1 2 3; do
              npx --yes wrangler@4 r2 object put "$R2_BUCKET/$1" --file="$2" \
                --content-type="$3" --remote && return 0
              echo "::warning::R2 put $1 failed (attempt $i/3)"; sleep 5
            done
            echo "::error::R2 put $1 failed after 3 attempts"
            return 1
          }
          if [ -d data/raw_runs ]; then
            find data/raw_runs -type f | while read -r p; do
              put "raw/${p#data/raw_runs/}" "$p" "application/octet-stream" || exit 1
            done || exit 1
          fi
          if [ -d data/snapshots ]; then
            find data/snapshots -type f -name '*.json' | while read -r p; do
              put "snapshots/${p#data/snapshots/}" "$p" "application/json" || exit 1
            done || exit 1
          fi
          # legacy csv/xlsx (pipeline/outputs/legacy.py, data/ = build --out-dir default)
          # -> R2 legacy/ (ARCH §5); nothing is committed to git.
          [ -f data/nfl_weather.csv ] && put "legacy/nfl_weather.csv" data/nfl_weather.csv "text/csv"
          [ -f data/cfb_weather.xlsx ] && put "legacy/cfb_weather.xlsx" data/cfb_weather.xlsx "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
          for p in data/board/*.json; do
            [ -f "$p" ] || continue
            f="$(basename "$p")"
            [ "$f" = "meta.json" ] && continue
            put "board/$f" "$p" "application/json"
          done
          for f in $STATE_FILES; do
            [ -f "data/state/$f.json" ] || continue
            put "board/$f.json" "data/state/$f.json" "application/json"
          done
          put "board/meta.json" "data/board/meta.json" "application/json"
      - name: Archive to D1 (change-only)
        if: hashFiles('data/d1_inserts.sql') != ''
        run: |
          npx --yes wrangler@4 d1 execute "$D1_DATABASE" --remote --yes --file=data/d1_inserts.sql
      - name: Self-check published board
        run: |
          mkdir -p data/check
          npx --yes wrangler@4 r2 object get "$R2_BUCKET/board/meta.json" --file=data/check/meta.json --remote
          python -m pipeline.outputs.r2 --self-check --run-id "$RUN_ID" \
            --meta-file data/check/meta.json --prev-meta data/state/prev_meta.json ${FORCE:+--force}
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-runs-${{ github.run_id }}
          path: |
            data/raw_runs/
            data/board/
            data/d1_inserts.sql
          if-no-files-found: ignore
          retention-days: 7
      - name: Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG=$(printf '🚨 SYSTEM · Pipeline failed\nJob: light · Trigger: %s · Sport: %s\nOpen run: %s' \
            '${{ github.event_name }}' "$SPORT" '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}')
          [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ] && curl -s --max-time 15 \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" --data-urlencode text="$MSG" >/dev/null || true

  playwright:
    # BetOnline needs Chromium (Cloudflare pass). Runs AFTER light so it re-scrapes
    # only the Playwright books, merges them onto the state light just pushed to
    # R2 (--merge-into-r2), re-writes the legacy files (NFL Spread_now/Total_now)
    # to R2 legacy/ and republishes the board with meta.json last.
    needs: [gate, light]
    if: needs.gate.outputs.run == 'scrape' && needs.gate.outputs.need_playwright == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps + Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run id (playwright)
        run: echo "RUN_ID=$(date -u +%Y%m%dT%H%M%SZ)-gh${{ github.run_id }}-${{ github.run_attempt }}-pw" >> "$GITHUB_ENV"
      - name: Fetch board state from R2 (playwright)
        run: |
          mkdir -p data/state
          for f in $STATE_FILES meta; do
            DEST="data/state/$f.json"
            [ "$f" = "meta" ] && DEST="data/state/prev_meta.json"
            if OUT="$(npx --yes wrangler@4 r2 object get "$R2_BUCKET/board/$f.json" --file="$DEST" --remote 2>&1)"; then
              echo "$f.json fetched"
            elif echo "$OUT" | grep -qiE 'NoSuchKey|does not exist|not found|404'; then
              echo "::notice::$f.json absent (first run) - state starts empty"
              rm -f "$DEST"
            else
              echo "$OUT"
              echo "::error::R2 state fetch failed for $f.json (not NoSuchKey) - refusing to run on blank state"
              exit 1
            fi
          done
      - name: Build board (BetOnline)
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m pipeline.build --sport "$SPORT" --scope odds --books betonline --print --run-id "$RUN_ID" --merge-into-r2 ${FORCE:+--force}
      - name: Push to R2 (playwright)
        run: |
          put() {  # put <r2 key> <local file>
            for i in 1 2 3; do
              npx --yes wrangler@4 r2 object put "$R2_BUCKET/$1" --file="$2" \
                --content-type="$3" --remote && return 0
              echo "::warning::R2 put $1 failed (attempt $i/3)"; sleep 5
            done
            echo "::error::R2 put $1 failed after 3 attempts"
            return 1
          }
          if [ -d data/raw_runs ]; then
            find data/raw_runs -type f | while read -r p; do
              put "raw/${p#data/raw_runs/}" "$p" "application/octet-stream" || exit 1
            done || exit 1
          fi
          if [ -d data/snapshots ]; then
            find data/snapshots -type f -name '*.json' | while read -r p; do
              put "snapshots/${p#data/snapshots/}" "$p" "application/json" || exit 1
            done || exit 1
          fi
          # legacy csv/xlsx (pipeline/outputs/legacy.py, data/ = build --out-dir default)
          # -> R2 legacy/ (ARCH §5); nothing is committed to git.
          [ -f data/nfl_weather.csv ] && put "legacy/nfl_weather.csv" data/nfl_weather.csv "text/csv"
          [ -f data/cfb_weather.xlsx ] && put "legacy/cfb_weather.xlsx" data/cfb_weather.xlsx "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
          for p in data/board/*.json; do
            [ -f "$p" ] || continue
            f="$(basename "$p")"
            [ "$f" = "meta.json" ] && continue
            put "board/$f" "$p" "application/json"
          done
          for f in $STATE_FILES; do
            [ -f "data/state/$f.json" ] || continue
            put "board/$f.json" "data/state/$f.json" "application/json"
          done
          put "board/meta.json" "data/board/meta.json" "application/json"
      - name: Archive to D1 (change-only, playwright)
        if: hashFiles('data/d1_inserts.sql') != ''
        run: |
          npx --yes wrangler@4 d1 execute "$D1_DATABASE" --remote --yes --file=data/d1_inserts.sql
      - name: Self-check published board (playwright)
        run: |
          mkdir -p data/check
          npx --yes wrangler@4 r2 object get "$R2_BUCKET/board/meta.json" --file=data/check/meta.json --remote
          python -m pipeline.outputs.r2 --self-check --run-id "$RUN_ID" \
            --meta-file data/check/meta.json --prev-meta data/state/prev_meta.json ${FORCE:+--force}
      - name: Upload build logs (playwright)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-runs-pw-${{ github.run_id }}
          path: |
            data/raw_runs/
            data/board/
            data/d1_inserts.sql
          if-no-files-found: ignore
          retention-days: 7
      - name: Telegram on failure (playwright)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG=$(printf '🚨 SYSTEM · Pipeline failed\nJob: BetOnline · Trigger: %s · Sport: %s\nOpen run: %s' \
            '${{ github.event_name }}' "$SPORT" '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}')
          [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ] && curl -s --max-time 15 \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" --data-urlencode text="$MSG" >/dev/null || true

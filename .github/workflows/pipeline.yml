name: pipeline

# Phase 3: schedule -> stadiums -> weather -> impact v1 -> odds (httpx books in the
# light job, BetOnline in the Playwright job) -> board JSON + D1 SQL + legacy files.
#
#   * State (openers / history / wx_history / archive_last / wx_last / alerts /
#     scrape_baseline / telegram_state / cf_heartbeat / closings / status) round-trips
#     through R2 board/: fetched BEFORE the build (a missing object is a fresh
#     start; ANY other wrangler error fails the job so a transient outage can
#     never clobber openers or alert markers), pushed back AFTER.
#   * R2 put order: raw/ captures, snapshots/, board payloads, state files, and
#     board/meta.json LAST as the commit marker (a mid-loop failure leaves the old
#     meta over old-or-new data, never new meta over mixed vintages).
#   * D1 (football-odds) gets data/d1_inserts.sql (change-only) via
#     `wrangler d1 execute --file`, gated by hashFiles so an empty run is a no-op.
#   * Self-check re-fetches board/meta.json and asserts run_id + a 50 % content
#     floor for each sport this run rebuilt (bypassed by the `force` input).
#     A CFB-only hour does not fail because NFL was not rebuilt. An empty
#     rebuild of a sport that was rebuilt is still rejected.
#   * Nothing is committed back to git (Phase 4): the legacy nfl_weather.csv /
#     cfb_weather.xlsx are written to data/ and uploaded to R2 legacy/ in the put
#     loop; data/state/ rides R2 board/.
#
# Primary scheduler: Cloudflare Worker crons (site/worker/wrangler.toml) dispatch
# this workflow; the schedule below is the off-the-minute UTC backstop.
# Adapted from golf_scraping/.github/workflows/board.yml (R2 loops, d1 execute,
# optional run-level Telegram failure page) + betonline.yml (Playwright job); the golf commit loop
# is intentionally NOT ported (no generated data in git).
#
# Requires GitHub secrets: CFBD_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID,
# CLOUDFLARE_API_TOKEN (Workers Scripts:Edit, R2:Edit, D1:Edit), CF_ACCOUNT_ID.
# Optional: PROPHETX_*; BOOK_BETONLINE_ENABLED=0 (repo variable) skips Playwright;
#   BOOK_PROPHETX_ENABLED=0 (repo variable) skips ProphetX (sandbox-only creds).

on:
  # GitHub schedule is only a SPARSE BACKSTOP (~every 3-4h on game days, off-the-
  # minute UTC). The Cloudflare Worker dispatches the hourly game-day cadence
  # (shouldDispatch in site/worker/index.js); GitHub drops scheduled ticks, so
  # the Worker is primary. The gate job skips a backstop tick when a Worker/manual
  # dispatch started within the last 50 minutes, and the concurrency group below
  # queues any remaining overlap, so the two never double-run.
  schedule:
    - cron: '17 9 * * *'
    - cron: '17 14,20 * * 2,3'     # Tue/Wed 10:17, 16:17 ET (openers)
    - cron: '17 12,16,20 * * 4,5'  # Thu/Fri every 4h
    - cron: '17 15,18,21 * * 6'    # Sat CFB afternoon/evening
    - cron: '17 0,3,15,18,21 * * 0'  # Sat night UTC + Sun NFL
    - cron: '17 0,14,20,23 * * 1'  # Sun night UTC + Mon
  workflow_dispatch:
    inputs:
      sport:
        description: 'Sport to build'
        type: choice
        required: false
        default: all
        options:
          - all
          - nfl
          - cfb
      scope:
        description: 'Build scope: weather, light (API books), full (all books), exchanges (exchange books only)'
        type: choice
        required: false
        default: full
        options:
          - weather
          - light
          - full
          - exchanges
      safe_refresh:
        description: 'Publish validation data without Telegram messages'
        type: boolean
        required: false
        default: false
      force:
        description: 'Bypass the kickoff-horizon gate and the publish content floor'
        type: boolean
        required: false
        default: false

# Serialize writers so two ticks can never race on the R2 put loop.
# Queue rather than cancel so an in-flight build completes instead of leaving
# a partial publish.
concurrency:
  group: football-refresh
  cancel-in-progress: false

env:
  SPORT: ${{ inputs.sport || 'all' }}
  SCOPE: ${{ inputs.scope || 'full' }}
  TELEGRAM_DISABLED: ${{ inputs.safe_refresh == true && '1' || '0' }}
  FORCE: ${{ inputs.force == true && '1' || '' }}
  # Per-book kill switches (repo variables; default on). Disabled books are skipped
  # entirely: no scrape, no "0 lines" degradation, excluded from the volume check.
  BOOK_BETONLINE_ENABLED: ${{ vars.BOOK_BETONLINE_ENABLED || '1' }}
  BOOK_PINNACLE_ENABLED: ${{ vars.BOOK_PINNACLE_ENABLED || '1' }}
  BOOK_BETCRIS_ENABLED: ${{ vars.BOOK_BETCRIS_ENABLED || '1' }}
  BOOK_FANDUEL_ENABLED: ${{ vars.BOOK_FANDUEL_ENABLED || '1' }}
  BOOK_KALSHI_ENABLED: ${{ vars.BOOK_KALSHI_ENABLED || '1' }}
  BOOK_POLYMARKET_US_ENABLED: ${{ vars.BOOK_POLYMARKET_US_ENABLED || '1' }}
  BOOK_NOVIG_ENABLED: ${{ vars.BOOK_NOVIG_ENABLED || '1' }}
  BOOK_PROPHETX_ENABLED: ${{ vars.BOOK_PROPHETX_ENABLED || '1' }}
  # Model driving edges/alerts (ARCH §7.5). Stays v1 until the calibrate promotion rule is met;
  # pipeline/model/config.py falls back to v1 on any unknown value.
  ALERT_MODEL: ${{ vars.ALERT_MODEL || 'v1' }}
  # Telegram is an action channel. These repo variables can relax/tighten the
  # defaults without a code deploy.
  TELEGRAM_MIN_TIER: ${{ vars.TELEGRAM_MIN_TIER || 'low' }}
  TELEGRAM_MAX_PER_RUN: ${{ vars.TELEGRAM_MAX_PER_RUN || '4' }}
  TELEGRAM_INCLUDE_OPENERS: ${{ vars.TELEGRAM_INCLUDE_OPENERS || '0' }}
  # Restore legacy per-run snapshots only when explicitly requested.
  TELEGRAM_OPEN_SIGNAL_SNAPSHOTS: ${{ vars.TELEGRAM_OPEN_SIGNAL_SNAPSHOTS || '0' }}
  # SYSTEM paging is deliberately off unless an operator explicitly opts in.
  TELEGRAM_SYSTEM_ALERTS: ${{ vars.TELEGRAM_SYSTEM_ALERTS || '0' }}
  R2_BUCKET: football-board
  D1_DATABASE: football-odds
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
  # Optional. When both are set, scripts/publish_r2.py uploads via the S3 API instead of a
  # Wrangler process per object. Unset secrets render as empty strings, so
  # r2.config_from_env() returns None and the Wrangler path is used.
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  # State files that round-trip through R2 board/ (ARCH §5).
  STATE_FILES: openers history wx_history archive_last wx_last alerts scrape_baseline telegram_state cf_heartbeat closings status ensemble_cache nws_points bet_confirmations book_health

jobs:
  gate:
    # Cheap httpx-only check BEFORE installing the full stack: skip when no
    # kickoff is within the horizon (off-season). Fail-open to scrape.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.gate.outputs.run }}
      need_playwright: ${{ steps.gate.outputs.need_playwright }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install gate deps
        run: pip install httpx
      - name: Skip backstop tick after a recent dispatch
        id: recent
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fail-open: any error leaves skip empty and the gate runs normally.
          SINCE="$(date -u -d '50 minutes ago' +%Y-%m-%dT%H:%M:%SZ)"
          N="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN"             "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pipeline.yml/runs?event=workflow_dispatch&created=%3E%3D$SINCE&per_page=20"             | jq '[.workflow_runs[] | select(.conclusion != "failure" and .conclusion != "cancelled")] | length')" || N=0
          echo "Recent dispatch runs: ${N:-0}"
          if [ "${N:-0}" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - name: Kickoff-horizon gate
        id: gate
        if: steps.recent.outputs.skip != 'true'
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          PIPELINE_FORCE: ${{ inputs.force == true && '1' || '' }}
        run: |
          python -m pipeline.gate_check --sport "$SPORT" > gate.txt 2> gate.err || true
          cat gate.err || true
          cat gate.txt
          RUN="$(grep '^run=' gate.txt | tail -n1 | cut -d= -f2 || true)"
          case "$RUN" in
            skip) ;;
            *) RUN=scrape ;;   # fail-open: error/blank/unexpected -> scrape
          esac
          echo "Gate decision: $RUN"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          # Chromium only when the scope asks for the Playwright books and the
          # book is enabled; the light job never installs Playwright.
          NEED=false
          if [ "$RUN" = "scrape" ] && [ "$SCOPE" = "full" ] && [ "$BOOK_BETONLINE_ENABLED" != "0" ]; then
            NEED=true
          fi
          echo "need_playwright=$NEED"
          echo "need_playwright=$NEED" >> "$GITHUB_OUTPUT"

  light:
    needs: gate
    if: needs.gate.outputs.run == 'scrape'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Restore npm cache (Wrangler 4)
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-wrangler-4
      - name: Warm Wrangler CLI cache (cache miss only)
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npx --yes wrangler@4 --version
      - name: Install deps (no Playwright / Streamlit in the light job)
        run: |
          python -m pip install --upgrade pip
          grep -viE '^(playwright|playwright-stealth|streamlit|streamlit-plotly-events|plotly|fsspec|pytz)\b' requirements.txt > requirements-light.txt
          pip install -r requirements-light.txt
      - name: Run id
        run: echo "RUN_ID=$(date -u +%Y%m%dT%H%M%SZ)-gh${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
      - name: Fetch board state from R2
        # NoSuchKey (first run / new file) -> empty default. ANY other failure
        # (auth, 5xx, network) -> exit 1: running on blank state would re-record
        # openers and re-send every alert. This step must always fail the job.
        run: python scripts/fetch_r2.py state --dest data/state
      - name: Fetch wind-signal history
        run: |
          python scripts/fetch_r2.py object backtest/wind-history-v1.json data/state/wind-history-v1.json \
            --warn-message 'Historical wind archive unavailable; alerts will label the coverage gap'
          python scripts/fetch_r2.py object board/backtest.json data/state/backtest.json \
            --warn-message 'Wind history unavailable; alerts will label it unavailable'
      - name: Recover receipts from recent failed runs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CURRENT_GITHUB_RUN_ID: ${{ github.run_id }}
        run: python scripts/recover_alert_receipts.py --state-dir data/state
      - name: Build board
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROPHETX_API_KEY: ${{ secrets.PROPHETX_API_KEY }}
          PROPHETX_ACCESS_KEY: ${{ secrets.PROPHETX_ACCESS_KEY }}
          PROPHETX_SECRET_KEY: ${{ secrets.PROPHETX_SECRET_KEY }}
        run: |
          # 'full' runs the httpx books here; BetOnline is added by the playwright job.
          LIGHT_SCOPE="$SCOPE"
          [ "$LIGHT_SCOPE" = "full" ] && LIGHT_SCOPE=light
          python -m pipeline.build --sport "$SPORT" --scope "$LIGHT_SCOPE" --print --no-alerts --run-id "$RUN_ID" --weather-handoff-dir data/weather-points ${FORCE:+--force}
      - name: Upload same-workflow weather inputs
        uses: actions/upload-artifact@v4
        with:
          name: weather-points-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/weather-points/
          retention-days: 1
          if-no-files-found: warn
      - name: Push to R2
        # Bound upload concurrency to eight Wrangler processes. Keep meta.json as
        # the final commit marker and recheck quote freshness after slow raw uploads.
        run: |
          python scripts/publish_r2.py raw
          python scripts/publish_r2.py snapshots
          PUBLISH_GUARD_STARTED="$(date +%s)"
          # Raw uploads can outlast feed TTLs. Revalidate current board/legacy
          # prices immediately before their put loop; consumers enforce expiry too.
          python -m pipeline.current_quotes --board-dir data/board --publication-window-seconds 120
          # Reject a bad or empty rebuild before replacing any current board objects.
          # The floor counts only sports this run rebuilt (meta.sport).
          python -m pipeline.outputs.r2 --self-check --run-id "$RUN_ID" \
            --meta-file data/board/meta.json --prev-meta data/state/prev_meta.json ${FORCE:+--force}
          # legacy csv/xlsx (pipeline/outputs/legacy.py, data/ = build --out-dir default)
          # -> R2 legacy/ (ARCH §5); nothing is committed to git.
          python scripts/publish_r2.py legacy
          python scripts/publish_r2.py board
          python scripts/publish_r2.py state
          PUBLISH_GUARD_ELAPSED=$(( $(date +%s) - PUBLISH_GUARD_STARTED ))
          if [ "$PUBLISH_GUARD_ELAPSED" -gt 80 ]; then
            echo "::error::Critical board/state publication took ${PUBLISH_GUARD_ELAPSED}s after the freshness guard; refusing to write the commit marker"
            exit 1
          fi
          python scripts/publish_r2.py meta
      - name: Archive to D1 (change-only)
        if: hashFiles('data/d1_inserts.sql') != ''
        run: |
          npx --yes wrangler@4 d1 execute "$D1_DATABASE" --remote --yes --file=data/d1_inserts.sql
      - name: Self-check published board
        run: |
          mkdir -p data/check
          python scripts/fetch_r2.py object board/meta.json data/check/meta.json
          python -m pipeline.outputs.r2 --self-check --run-id "$RUN_ID" \
            --meta-file data/check/meta.json --verify-generation --prev-meta data/state/prev_meta.json ${FORCE:+--force}
      - name: Notify published board
        if: ${{ inputs.safe_refresh != true && (inputs.scope || 'full') != 'weather' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MAX_LEAD_DAYS: ${{ vars.TELEGRAM_MAX_LEAD_DAYS || '7' }}
        run: python -m pipeline.published_alerts --board-dir data/board --state-dir data/state --run-id "$RUN_ID" --bucket "$R2_BUCKET"
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-runs-${{ github.run_id }}
          path: |
            data/raw_runs/
            data/board/
            data/d1_inserts.sql
          if-no-files-found: ignore
          retention-days: 7
  playwright:
    # BetOnline needs Chromium (Cloudflare pass). Runs AFTER light so it re-scrapes
    # BetOnline plus BetCRIS, merges them onto the state light just pushed to
    # R2 (--merge-into-r2), re-writes the legacy files (NFL Spread_now/Total_now)
    # to R2 legacy/ and republishes the board with meta.json last.
    needs: [gate, light]
    if: needs.gate.outputs.run == 'scrape' && needs.gate.outputs.need_playwright == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Restore npm cache (Wrangler 4)
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-wrangler-4
      - name: Warm Wrangler CLI cache (cache miss only)
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npx --yes wrangler@4 --version
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Playwright version
        id: pw-version
        run: echo "version=$(python -m playwright --version | awk '{print $NF}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ steps.pw-version.outputs.version }}
      - name: Install Chromium (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium
      - name: Install Chromium system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium
      - name: Run id (playwright)
        run: echo "RUN_ID=$(date -u +%Y%m%dT%H%M%SZ)-gh${{ github.run_id }}-${{ github.run_attempt }}-pw" >> "$GITHUB_ENV"
      - name: Fetch board state from R2 (playwright)
        run: python scripts/fetch_r2.py state --dest data/state
      - name: Fetch wind-signal history (playwright)
        run: |
          python scripts/fetch_r2.py object backtest/wind-history-v1.json data/state/wind-history-v1.json \
            --warn-message 'Historical wind archive unavailable; alerts will label the coverage gap'
          python scripts/fetch_r2.py object board/backtest.json data/state/backtest.json \
            --warn-message 'Wind history unavailable; alerts will label it unavailable'
      - name: Download same-workflow weather inputs
        # Absent inputs trigger fresh point fetches; state steps still fail closed.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: weather-points-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/weather-reuse/
      - name: Build board (BetOnline)
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Refresh BetCRIS here too: the light upload can outlast the short
          # college feed TTL. Do not carry that earlier capture as current odds.
          python -m pipeline.build --sport "$SPORT" --scope odds --books betonline,betcris --print --no-alerts --run-id "$RUN_ID" --merge-into-r2 --reuse-weather-dir data/weather-reuse ${FORCE:+--force}
      - name: Push to R2 (playwright)
        run: |
          python scripts/publish_r2.py raw
          python scripts/publish_r2.py snapshots
          PUBLISH_GUARD_STARTED="$(date +%s)"
          python -m pipeline.current_quotes --board-dir data/board --publication-window-seconds 120
          # Same floor as the light job: only sports this run rebuilt.
          python -m pipeline.outputs.r2 --self-check --run-id "$RUN_ID" \
            --meta-file data/board/meta.json --prev-meta data/state/prev_meta.json ${FORCE:+--force}
          # legacy csv/xlsx (pipeline/outputs/legacy.py, data/ = build --out-dir default)
          # -> R2 legacy/ (ARCH §5); nothing is committed to git.
          python scripts/publish_r2.py legacy
          python scripts/publish_r2.py board
          python scripts/publish_r2.py state
          PUBLISH_GUARD_ELAPSED=$(( $(date +%s) - PUBLISH_GUARD_STARTED ))
          if [ "$PUBLISH_GUARD_ELAPSED" -gt 80 ]; then
            echo "::error::Critical board/state publication took ${PUBLISH_GUARD_ELAPSED}s after the freshness guard; refusing to write the commit marker"
            exit 1
          fi
          python scripts/publish_r2.py meta
      - name: Archive to D1 (change-only, playwright)
        if: hashFiles('data/d1_inserts.sql') != ''
        run: |
          npx --yes wrangler@4 d1 execute "$D1_DATABASE" --remote --yes --file=data/d1_inserts.sql
      - name: Self-check published board (playwright)
        run: |
          mkdir -p data/check
          python scripts/fetch_r2.py object board/meta.json data/check/meta.json
          python -m pipeline.outputs.r2 --self-check --run-id "$RUN_ID" \
            --meta-file data/check/meta.json --verify-generation --prev-meta data/state/prev_meta.json ${FORCE:+--force}
      - name: Notify published board (playwright)
        if: ${{ inputs.safe_refresh != true && (inputs.scope || 'full') != 'weather' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MAX_LEAD_DAYS: ${{ vars.TELEGRAM_MAX_LEAD_DAYS || '7' }}
        run: python -m pipeline.published_alerts --board-dir data/board --state-dir data/state --run-id "$RUN_ID" --bucket "$R2_BUCKET"
      - name: Upload build logs (playwright)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-runs-pw-${{ github.run_id }}
          path: |
            data/raw_runs/
            data/board/
            data/d1_inserts.sql
          if-no-files-found: ignore
          retention-days: 7
  notify_failure:
    # Page when the publish is rejected or the gate or main (light) build fails.
    # A Playwright/BetOnline failure alone pages only when TELEGRAM_SYSTEM_ALERTS=1.
    # The job condition is only always(): a skipped Playwright job must not skip
    # this page (GitHub skips a dependent job when one need was skipped unless
    # the condition is unconditional). The step decides whether to send.
    # safe_refresh stays quiet. Cancelled runs do not page.
    needs: [gate, light, playwright]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Telegram on failure
        if: ${{ !cancelled() && inputs.safe_refresh != true && (needs.gate.result == 'failure' || needs.light.result == 'failure' || (needs.playwright.result == 'failure' && vars.TELEGRAM_SYSTEM_ALERTS == '1')) }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG=$(printf '🚨 SYSTEM · Pipeline failed\nJobs: gate=%s · light=%s · BetOnline=%s\nTrigger: %s · Sport: %s\nOpen run: %s' \
            '${{ needs.gate.result }}' '${{ needs.light.result }}' '${{ needs.playwright.result }}' \
            '${{ github.event_name }}' "$SPORT" '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}')
          [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ] && curl -s --max-time 15 \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" --data-urlencode text="$MSG" >/dev/null || true

name: backtest

# Phase 6: weekly backtest + CLV (ARCH §9.3, PLAN Phase 6).
#
#   * Tuesday 06:17 ET-ish (10:17 UTC, off-the-minute like pipeline.yml): fetch the
#     state files pipeline.backtest reads from R2 board/ (alerts, closings, history,
#     wx_history, openers), pull the D1 tables it joins as {table}.json
#     (`d1 execute --json`), mirror the R2 snapshots/ those exports reference (wrangler
#     `r2 object get`, newest SNAPSHOT_MAX), run `python -m pipeline.backtest` -> data/board/backtest.json (bucket
#     grid + stadium results + matched games + alerts_clv by tier/league/book/model)
#     and data/backtest/*.parquet, push backtest.json to R2 board/ and the parquet
#     files to R2 backtest/, and archive the closings / stadium_results rows it
#     produced to D1. The board's Backtest tab reads /data/backtest.json.
#   * Monday 08:17 ET-ish (12:17 UTC): same job, plus the weekly CLV digest
#     (`python -m pipeline.alerts --digest clv`) — CLV by tier/league/book, v1 vs v2
#     and the promotion gate, from alerts.json records + the fresh backtest.json.
#   * `from_git: true` (dispatch only) additionally replays the 2024/2025 seasons out of the
#     legacy line/forecast archive in this repo's own git history
#     (docs/HISTORICAL_BACKTEST_SPEC.md): needs `fetch-depth: 0`, CFBD_API_KEY for the CFB
#     schedule/scores, and the ERA5 window cache from R2. Runs without it carry the historical
#     column groups forward by merging the published backtest.json (pipeline.backtest
#     `hist_from_previous`), so the tab never loses them.
#   * State is read-only here: nothing under board/ except backtest.json is written,
#     so this job can never clobber openers or alert markers. A failed R2 state fetch
#     (anything but NoSuchKey) still fails the job — a backtest on blank state would
#     publish an empty grid over a good one.
#
# Requires GitHub secrets: CLOUDFLARE_API_TOKEN (R2:Edit, D1:Read), CF_ACCOUNT_ID,
# TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID; optional CFBD_API_KEY (scores), TELEGRAM_CHAT_ID_NFL/CFB.

on:
  schedule:
    - cron: '17 10 * * 2'    # Tue 06:17 EDT / 05:17 EST — weekly backtest
    - cron: '17 12 * * 1'    # Mon 08:17 EDT / 07:17 EST — backtest + CLV digest
  workflow_dispatch:
    inputs:
      digest:
        description: 'Also send the weekly CLV digest to Telegram'
        type: boolean
        required: false
        default: false
      dry_run:
        description: 'Build backtest.json but push nothing and print the digest instead of sending'
        type: boolean
        required: false
        default: false
      from_git:
        description: 'Also replay past seasons from the git line/forecast archive (slow: full clone)'
        type: boolean
        required: false
        default: false
      seasons:
        description: 'Seasons to replay with from_git'
        type: string
        required: false
        default: '2024,2025'

# Same group as pipeline.yml: never race the board's R2 put loop.
concurrency:
  group: football-refresh
  cancel-in-progress: false

permissions:
  contents: read

env:
  R2_BUCKET: football-board
  D1_DATABASE: football-odds
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
  DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
  FROM_GIT: ${{ inputs.from_git == true && '1' || '' }}
  SEASONS: ${{ inputs.seasons || '2024,2025' }}
  # Monday schedule or explicit dispatch input -> send the CLV digest.
  SEND_DIGEST: ${{ (github.event_name == 'schedule' && github.event.schedule == '17 12 * * 1') || inputs.digest == true }}
  # Read-only inputs for pipeline.backtest (ARCH §5 state files; pipeline.backtest.D1_TABLES).
  STATE_FILES: alerts closings history wx_history openers
  D1_TABLES: games odds_history closings alerts stadiums teams weather_history
  # newest snapshot objects mirrored per run (one `wrangler r2 object get` each)
  SNAPSHOT_MAX: "120"
  # per-kickoff ERA5 means for the historical replay (site/worker/SETUP.md uploads it)
  ERA5_WINDOWS: backtest/era5/windows.parquet

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # the historical replay walks the legacy nfl_weather.csv / cfb_weather.xlsx history
          fetch-depth: ${{ inputs.from_git == true && 0 || 1 }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps (no Playwright)
        run: |
          python -m pip install --upgrade pip
          grep -viE '^(playwright|playwright-stealth|streamlit|streamlit-plotly-events|plotly|fsspec|pytz)\b' requirements.txt > requirements-light.txt
          pip install -r requirements-light.txt
      - name: Run id
        run: echo "RUN_ID=$(date -u +%Y%m%dT%H%M%SZ)-bt${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
      - name: Fetch board state from R2 (read-only)
        # NoSuchKey -> absent (fresh bucket). ANY other failure -> exit 1: a backtest
        # on blank state would publish an empty grid over the last good one.
        run: |
          mkdir -p data/state
          for f in $STATE_FILES meta; do
            DEST="data/state/$f.json"
            [ "$f" = "meta" ] && DEST="data/state/prev_meta.json"
            if OUT="$(npx --yes wrangler@4 r2 object get "$R2_BUCKET/board/$f.json" --file="$DEST" --remote 2>&1)"; then
              echo "$f.json fetched"
            elif echo "$OUT" | grep -qiE 'NoSuchKey|does not exist|not found|404'; then
              echo "::notice::$f.json absent - backtest input starts empty"
              rm -f "$DEST"
            else
              echo "$OUT"
              echo "::error::R2 state fetch failed for $f.json (not NoSuchKey) - refusing to backtest on blank state"
              exit 1
            fi
          done
      - name: Fetch the published backtest.json from R2 (read-only)
        # pipeline.backtest merges the previous payload's by_season / tier_scorecard / hist_games
        # when it is not replaying the archive itself, so a weekly run never drops them.
        run: |
          mkdir -p data/board
          if OUT="$(npx --yes wrangler@4 r2 object get "$R2_BUCKET/board/backtest.json" --file=data/board/backtest.json --remote 2>&1)"; then
            echo "board/backtest.json fetched"
          elif echo "$OUT" | grep -qiE 'NoSuchKey|does not exist|not found|404'; then
            echo "::notice::board/backtest.json absent - nothing to carry forward"
            rm -f data/board/backtest.json
          else
            echo "$OUT"
            echo "::error::R2 fetch failed for board/backtest.json (not NoSuchKey)"
            exit 1
          fi
      - name: Fetch the ERA5 window cache from R2 (read-only)
        # The historical replay needs the ERA5 mean over each kickoff window, not the 600+ MB of
        # hourly archive files it was reduced from: backtest_git.fill_actuals reads
        # windows.parquet first and only opens an hourly file on a miss. Upload it after a local
        # --from-git run with the command in site/worker/SETUP.md.
        if: env.FROM_GIT != ''
        run: |
          mkdir -p data/backtest/era5
          if OUT="$(npx --yes wrangler@4 r2 object get "$R2_BUCKET/$ERA5_WINDOWS" --file=data/backtest/era5/windows.parquet --remote 2>&1)"; then
            echo "era5 window cache fetched"
          elif echo "$OUT" | grep -qiE 'NoSuchKey|does not exist|not found|404'; then
            echo "::warning::$ERA5_WINDOWS absent - the historical rows will have no actuals"
            rm -f data/backtest/era5/windows.parquet
          else
            echo "$OUT"
            echo "::error::R2 fetch failed for $ERA5_WINDOWS (not NoSuchKey)"
            exit 1
          fi
      - name: Export D1 tables
        # {table}.json per table in the `d1 execute --json` shape ([{results: [...]}]),
        # which pipeline.backtest.load_export_dir reads. A missing table on a fresh
        # database is a warning, not a failure.
        run: |
          mkdir -p data/d1_export
          for t in $D1_TABLES; do
            if npx --yes wrangler@4 d1 execute "$D1_DATABASE" --remote --json --command "SELECT * FROM $t" > "data/d1_export/$t.json"; then
              echo "$t.json exported"
            else
              echo "::warning::d1 export $t failed (fresh database?)"; rm -f "data/d1_export/$t.json"
            fi
          done
          ls -la data/d1_export
      - name: Mirror snapshots from R2 (wrangler, read-only)
        # snapshots/{sport}/{season}/{week}/{run_id}.json are the per-run GameCard lists the
        # backtest replays for lead-N forecasts. wrangler cannot list a prefix, so the keys
        # are rebuilt from the D1 export just made: every (game_id, run_id) in
        # weather_history / odds_history names the snapshot that run wrote (game_id =
        # sport:season:week:away@home, run_id = the snapshot stem). Newest SNAPSHOT_MAX runs
        # only (one wrangler call per object); older weeks are carried by the D1 tables.
        # Same get loop as pipeline.yml: NoSuchKey -> skipped, ANY other failure -> exit 1.
        run: |
          mkdir -p data/snapshots
          python - <<'PY'
          import json, os
          from pathlib import Path
          keys = set()
          for t in ("weather_history", "odds_history"):
              p = Path("data/d1_export") / f"{t}.json"
              if not p.is_file():
                  continue
              for block in json.loads(p.read_text(encoding="utf-8")) or []:
                  for row in block.get("results") or []:
                      gid, run_id = str(row.get("game_id") or ""), str(row.get("run_id") or "")
                      parts = gid.split(":")
                      if len(parts) == 4 and run_id:
                          keys.add(f"snapshots/{parts[0]}/{parts[1]}/{parts[2]}/{run_id}.json")
          newest = sorted(keys, key=lambda k: k.rsplit("/", 1)[1], reverse=True)[: int(os.environ.get("SNAPSHOT_MAX", "120"))]
          Path("data/snapshot_keys.txt").write_text("\n".join(newest) + ("\n" if newest else ""), encoding="utf-8")
          print(f"{len(keys)} snapshot key(s) referenced by D1, mirroring {len(newest)}")
          PY
          n=0
          while read -r key; do
            [ -n "$key" ] || continue
            DEST="data/$key"
            mkdir -p "$(dirname "$DEST")"
            if OUT="$(npx --yes wrangler@4 r2 object get "$R2_BUCKET/$key" --file="$DEST" --remote 2>&1)"; then
              n=$((n + 1))
            elif echo "$OUT" | grep -qiE 'NoSuchKey|does not exist|not found|404'; then
              echo "::notice::$key absent in R2 - skipped"
              rm -f "$DEST"
            else
              echo "$OUT"
              echo "::error::R2 snapshot fetch failed for $key (not NoSuchKey) - refusing to backtest on a partial mirror"
              exit 1
            fi
          done < data/snapshot_keys.txt
          echo "mirrored $n snapshot object(s)"
      - name: Run backtest
        # State is read-only here (no --freeze): closings are frozen and alert CLV settled
        # by pipeline.yml every run; this job only reads alerts.json / closings.json.
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          mkdir -p data/board data/backtest
          python -m pipeline.backtest --state-dir data/state --snapshot-dir data/snapshots --export-dir data/d1_export \
            --board-dir data/board --parquet-dir data/backtest --d1-sql data/d1_backtest.sql \
            ${FROM_GIT:+--from-git --seasons "$SEASONS"}
          python - <<'PY'
          import json
          d = json.load(open("data/board/backtest.json"))
          hist = (d.get("meta") or {}).get("hist") or {}
          print(f"grid rows: {len(d.get('grid') or [])}  stadiums: {len(d.get('stadium_results') or [])}  games: {len(d.get('games') or [])}")
          print(f"historical: {hist.get('n_games', 0)} games, {hist.get('n_graded', 0)} graded, "
                f"{len(d.get('hist_games') or [])} listed, {len(d.get('tier_scorecard') or [])} scorecard rows")
          PY
      - name: Push backtest to R2
        # board/backtest.json (served as /data/backtest.json) + parquet under backtest/.
        # 3 retries each; a failure still fails the job. board/meta.json is NOT touched.
        if: env.DRY_RUN == ''
        run: |
          put() {  # put <r2 key> <local file> <content-type>
            for i in 1 2 3; do
              npx --yes wrangler@4 r2 object put "$R2_BUCKET/$1" --file="$2" \
                --content-type="$3" --remote && return 0
              echo "::warning::R2 put $1 failed (attempt $i/3)"; sleep 5
            done
            echo "::error::R2 put $1 failed after 3 attempts"
            return 1
          }
          for p in data/backtest/*.parquet; do
            [ -f "$p" ] || continue
            put "backtest/$(basename "$p")" "$p" "application/octet-stream"
          done
          put "board/backtest.json" "data/board/backtest.json" "application/json"
      - name: Archive backtest rows to D1 (closings / stadium_results)
        if: env.DRY_RUN == '' && hashFiles('data/d1_backtest.sql') != ''
        run: |
          npx --yes wrangler@4 d1 execute "$D1_DATABASE" --remote --yes --file=data/d1_backtest.sql
      - name: Weekly CLV digest
        if: env.SEND_DIGEST == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_NFL: ${{ secrets.TELEGRAM_CHAT_ID_NFL }}
          TELEGRAM_CHAT_ID_CFB: ${{ secrets.TELEGRAM_CHAT_ID_CFB }}
        run: |
          python -m pipeline.alerts --digest clv --state-dir data/state --backtest data/board/backtest.json ${DRY_RUN:+--dry-run}
      - name: Upload backtest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-${{ github.run_id }}
          path: |
            data/board/backtest.json
            data/backtest/
            data/d1_backtest.sql
          if-no-files-found: ignore
          retention-days: 30
      - name: Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG=$(printf '🚨 SYSTEM · Backtest failed\nTrigger: %s\nOpen run: %s' \
            '${{ github.event_name }}' '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}')
          [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ] && curl -s --max-time 15 \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" --data-urlencode text="$MSG" >/dev/null || true

# Public Novig MarketScreen_Query, verified live 2026-10-08.
# Source: https://novig.com/_expo/static/js/web/index-579bbfea17f41f44f9748b30988ddce9.js
# Preserve the full compiled document and fragment order: Hasura allowlists it.
# Main/alternate filters are variables; shouldSkipOrders=true excludes all orders.

query MarketScreen_Query($where: market_bool_exp, $ordersWhere: order_bool_exp, $shouldSkipOrders: Boolean!) { market(where: $where) { id type description strike status ...MarketData_Frag player { full_name } market_detail { question description settlementRules } event { game { id league sport } event_locks(order_by: {created_at: desc}, where: {deleted_at: {_is_null: true}}) { id event_id minute_duration created_at } id description league type status scheduled_start ...EventData_Frag ...EventScoreboard_Frag } outcomes(order_by: {index: desc}) { index ...Outcome_Frag ...MarketChart_Frag } orders(where: $ordersWhere, order_by: {created_at: desc}) @skip(if: $shouldSkipOrders) { id currency ...OrderStateCard_Frag } market_locks(order_by: {created_at: desc}, where: {deleted_at: {_is_null: true}}) { id market_id minute_duration created_at } competitor { id name swish_id short_name } } }

fragment TennisScoreboard_Frag on game { events { id status } home_set_1 home_set_2 home_set_3 home_set_4 home_set_5 away_set_1 away_set_2 away_set_3 away_set_4 away_set_5 possession home_game_score away_game_score homeTeam { id name } awayTeam { id name } }

fragment MarketVolume_Frag on market { id volume }

fragment EventData_Frag on event { id type status scheduled_start league game { id league sport scheduled_start period time_remaining home_score away_score awayTeam { id name symbol short_name mascot primary_color secondary_color swish_id optic_odds_id wins losses draws country } homeTeam { id name symbol short_name mascot primary_color secondary_color swish_id optic_odds_id wins losses draws country } } }

fragment Outcome_Frag on outcome { id available altAvailable index description competitor { id symbol } }

fragment OrderDescription_Frag on outcome { id index description competitor { id name symbol country } market { id type strike re_settled_at market_detail { description title } event { id description ...EventData_Frag } player { id full_name } competitor { id name short_name symbol country } } }

fragment MarketData_Frag on market { id type strike status re_settled_at competitor { id name country } market_locks(order_by: {created_at: desc}, where: {deleted_at: {_is_null: true}}) { id market_id created_at minute_duration } player { id full_name } }

fragment EventScoreboard_Frag on event { id type status description league scheduled_start game { id ...TennisScoreboard_Frag status home_score away_score period time_remaining down distance yardLine yardline_territory league sport homeTeam { id name short_name mascot symbol primary_color secondary_color wins losses draws swish_id optic_odds_id ranking country } awayTeam { id name short_name mascot symbol primary_color secondary_color wins losses draws swish_id optic_odds_id ranking country } } parent_event { id description } scoreboard_markets: markets(where: {type: {_eq: "MONEY"}}, limit: 1) { id type outcomes { id index status } } custom_markets: markets(where: {type: {_eq: "CUSTOM"}}, limit: 1) { id type } }

fragment MarketChart_Frag on outcome { id status market { id type settled_at ...MarketVolume_Frag outcomes { id status index description available altAvailable } event { id status scheduled_start game { id homeTeam { id primary_color secondary_color } awayTeam { id primary_color secondary_color } } } } }

fragment OrderStateCard_Frag on order { id timeToLiveMs qty originalQty price status created_at isBid tif currency wallet { currency type } fills { id created_at cost qty isWash isTaker } market { id status event { id ...EventData_Frag } player { id full_name } } outcome { id status available altAvailable description ...Outcome_Frag ...OrderDescription_Frag } }

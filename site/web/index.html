<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Football Weather Board</title>
<link rel="stylesheet" href="vendor/maplibre-gl.css" />
<link rel="stylesheet" href="vendor/uPlot.min.css" />
<link rel="stylesheet" href="styles.css?v=novig-depth-1" />
</head>
<body>
  <header>
    <h1>Football Weather</h1>
    <span class="event" id="event">—</span>
    <span class="updated" id="updated"></span>
    <span class="nextrun" id="nextrun"></span>
    <span class="chips" id="bookchips"></span>
    <div class="refresh-actions">
      <button class="refreshbtn fast" id="lightrefreshbtn" data-admin-refresh hidden
        title="Refresh enabled Kalshi, NoVig, ProphetX and Polymarket US lines for the selected sport, then rebuild the board">⚡ Refresh exchanges</button>
      <button class="refreshbtn" id="refreshbtn" data-admin-refresh hidden
        title="Refresh all enabled sportsbook and exchange lines for the selected sport, along with schedule and weather">↻ Refresh lines</button>
    </div>
    <span class="refreshmsg" id="refreshmsg"></span>
  </header>
  <div class="banners" id="banners"></div>
  <div class="tabs">
    <div class="tab" data-view="map" data-sport="nfl">NFL Map</div>
    <div class="tab" data-view="map" data-sport="cfb">CFB Map</div>
    <div class="tab" data-view="signals">Signals</div>
    <div class="tab active" data-view="table">Table</div>
    <div class="tab" data-view="alerts">Alerts</div>
    <div class="tab" data-view="backtest">Backtest</div>
    <div class="tab" data-view="status">Status</div>
    <button class="tab" data-view="execution" id="execution-tab" type="button" hidden>Execution</button>
  </div>
  <div id="tablemodebar" class="history-toolbar">
    <label>Table view <select id="tablemode"><option value="live">Current games</option><option value="history">Past weeks</option></select></label>
  </div>
  <div id="historybar" class="history-toolbar" style="display:none"></div>
  <div id="historyinfo" class="history-note" style="display:none"></div>
  <div class="controls">
    <select id="sport" title="Sport">
      <option value="nfl">NFL</option>
      <option value="cfb">CFB</option>
    </select>
    <select id="week" title="Week"></select>
    <select id="signal" title="Impact tier filter">
      <option value="">Signal: all</option>
      <option value="Very High">Very High</option>
      <option value="High">High</option>
      <option value="Mid">Mid</option>
      <option value="Low">Low (any)</option>
      <option value="No">No</option>
    </select>
    <select id="book" title="Book column focus / edge filter"></select>
    <span class="skillbox" title="Show only games whose best edge (pts) clears this">
      Min edge <input id="minedge" type="number" step="0.5" placeholder="pts" />
    </span>
    <label class="chk" title="Show dome / closed-roof games"><input type="checkbox" id="showdomes" checked /> domes</label>
    <label class="chk" title="Include watch-tier edges"><input type="checkbox" id="showwatch" checked /> watch</label>
    <label class="chk" title="Show one SPREAD column per book (consensus spread always shown)"><input type="checkbox" id="bookspreads" /> book spreads</label>
    <input id="search" placeholder="Filter team / stadium…" />
    <button type="button" class="controlbtn presetchip" id="presetchip" style="display:none" title="Signals preset active — click to clear"></button>
    <span class="sub" id="rowcount"></span>
  </div>
  <div class="signalsbar" id="signalsbar" style="display:none"></div>
  <div class="statusbar" id="statusbar"></div>
  <div class="wrap" id="tablewrap"><table id="table"><thead></thead><tbody></tbody></table></div>
  <div id="mapwrap" style="display:none">
    <div id="map"></div>
    <div class="maplegend" id="maplegend"></div>
  </div>
  <div id="alertswrap" class="view-pane" style="display:none"></div>
  <div id="backtestwrap" class="view-pane" style="display:none"></div>
  <div id="statuswrap" class="view-pane" style="display:none"></div>
  <div id="executionwrap" class="view-pane" style="display:none"></div>
  <div id="hovercard"></div>
  <aside id="drawer" class="drawer" hidden>
    <div class="drawer-head">
      <div class="drawer-title" id="drawer-title"></div>
      <button class="controlbtn" id="drawer-close" type="button" title="Close (Esc)">✕</button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>
  <script src="vendor/maplibre-gl.js"></script>
  <script src="vendor/uPlot.iife.min.js"></script>
  <script src="status.js?v=alert-context-3"></script>
  <script src="table.js"></script>
  <script src="signals.js"></script>
  <script src="map.js"></script>
  <script src="execution-preview.js?v=novig-depth-1"></script>
  <script src="drawer.js?v=execution-tab-1"></script>
  <script src="alerts.js"></script>
  <script src="backtest.js?v=history-table-1"></script>
  <script src="history-table.js?v=history-table-3"></script>
  <script src="app.js?v=execution-tab-1"></script>
</body>
</html>
